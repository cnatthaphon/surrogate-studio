<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion-MNIST Benchmark — 7 Architectures Compared — Surrogate Studio</title>

  <!-- CDN libs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
  <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- Surrogate Studio bundle -->
  <script src="../../dist/surrogate-studio.js"></script>
  <script src="../../src/pretrained_loader.js"></script>

  <!-- Pretrained weights -->
  <script src="./m1_mlp_baseline_pretrained.js"></script>
  <script src="./m2_cnn_lenet_5_pretrained.js"></script>
  <script src="./m3_dense_autoencoder_pretrained.js"></script>
  <script src="./m4_conv_autoencoder_pretrained.js"></script>
  <script src="./m5_vae_pretrained.js"></script>
  <script src="./m6_vae_classifier_pretrained.js"></script>
  <script src="./m7_denoising_ae_pretrained.js"></script>

  <script src="./preset.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    var store = OSCWorkspaceStore.createMemoryStore();
    var preset = window.FASHION_MNIST_BENCHMARK_PRESET;
    if (preset) {
      if (preset.dataset) store.upsertDataset(preset.dataset);
      if (preset.models) preset.models.forEach(function (m) { store.upsertModel(m); });
      if (preset.trainers) preset.trainers.forEach(function (t) { store.upsertTrainerCard(t); });
      if (preset.trainers) OSCPretrainedLoader.loadAll(store, preset.trainers);
      OSCPretrainedLoader.ensureDatasetsReady(store);
      store.initTables({ tables: ["generationRuns", "evaluations"] });
      if (preset.generations) preset.generations.forEach(function (g) { store.save({ table: "generationRuns", values: [g] }); });
      if (preset.evaluations) preset.evaluations.forEach(function (e) { store.save({ table: "evaluations", values: [e] }); });
    }
    SurrogateStudio.init({ mountEl: document.getElementById("app"), defaultSchemaId: "fashion_mnist", defaultTab: "trainer", store: store });
  </script>
</body>
</html>
