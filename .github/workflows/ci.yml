name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Contract tests (31 scripts)
        run: npm test

      - name: Multi-schema pipeline (11 schemas)
        run: node scripts/test_headless_multi_schema_pipeline.js

      - name: Syntax check E2E script
        run: node --check scripts/test_github_pages_e2e.js

      - name: Validate README badges and markdown links
        run: node scripts/validate_docs.js

  python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Several Python parity tests spawn `node scripts/*.js` subprocesses
      # that require `@tensorflow/tfjs` (e.g. test_lstm_gate_parity.py,
      # test_gru_cross_runtime_parity.py, test_convae_runtime_fix.py,
      # test_convtranspose_*_parity.py). Jobs are isolated, so we have to
      # install Node deps in this job even though the JS contract job
      # already did the same install — they don't share artifacts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2" "numpy>=1.24"

      - name: Server-side parity tests (LSTM, GRU, Embedding, ConvTranspose, augment, ...)
        run: python scripts/test_python_all.py
